<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Japanese Training App</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/enterprise-theme.css">
    <link rel="stylesheet" href="css/index.css">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            padding: 1rem;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .brand-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
            color: #fff;
        }

        .success-message {
            display: none;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: #10b981;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="brand-logo">
                <i class="fas fa-graduation-cap fa-2x has-text-primary"></i>
                <h1 class="title is-4 has-text-white mb-0">日本語 Training</h1>
            </div>

            <div class="has-text-centered mb-5">
                <h2 class="title is-4 has-text-white">Reset Password</h2>
                <p class="subtitle is-6 has-text-grey-light">Enter your email to receive reset instructions</p>
            </div>

            <!-- Success Message Container -->
            <div id="successMessage" class="success-message">
                <i class="fas fa-check-circle mb-2 fa-2x"></i>
                <p class="has-text-weight-bold">Check your inbox</p>
                <p class="is-size-7">If an account exists for that email, we've sent instructions to reset your
                    password.</p>
            </div>

            <form id="resetForm" onsubmit="handleReset(event)">
                <div class="field">
                    <label class="label has-text-grey-light">Email Address</label>
                    <div class="control has-icons-left">
                        <input class="input" type="email" placeholder="name@company.com" required>
                        <span class="icon is-small is-left">
                            <i class="fas fa-envelope"></i>
                        </span>
                    </div>
                </div>

                <div class="field mt-5">
                    <button type="submit" class="button is-primary is-fullwidth is-medium">
                        Send Reset Link
                    </button>
                </div>
            </form>

            <div class="has-text-centered mt-5">
                <a href="login.html" class="is-size-7 has-text-grey-light hover:has-text-primary">
                    <i class="fas fa-arrow-left mr-1"></i> Back to Login
                </a>
            </div>
        </div>
    </div>

    <script>
        function handleReset(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerHTML;

            // Loading state
            btn.classList.add('is-loading');

            // Simulate API call
            setTimeout(() => {
                btn.classList.remove('is-loading');
                document.getElementById('resetForm').style.display = 'none';
                document.getElementById('successMessage').style.display = 'block';
            }, 1500);
        }
    </script>
</body>

</html>
